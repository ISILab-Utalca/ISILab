  commentId: M:PathOS.PathOSNavUtility.NavmeshMemoryMapper.XZRaycastMemoryMap(UnityEngine.Vector3,UnityEngine.Vector3,System.Single,PathOS.PathOSNavUtility.NavmeshMemoryMapper.NavmeshMemoryMapperCastHit@,System.Boolean,System.Boolean)
  id: XZRaycastMemoryMap(UnityEngine.Vector3,UnityEngine.Vector3,System.Single,PathOS.PathOSNavUtility.NavmeshMemoryMapper.NavmeshMemoryMapperCastHit@,System.Boolean,System.Boolean)
  parent: PathOS.PathOSNavUtility.NavmeshMemoryMapper
  langs:
  - csharp
  - vb
  name: XZRaycastMemoryMap(Vector3, Vector3, float, out NavmeshMemoryMapperCastHit, bool, bool)
  nameWithType: PathOSNavUtility.NavmeshMemoryMapper.XZRaycastMemoryMap(Vector3, Vector3, float, out PathOSNavUtility.NavmeshMemoryMapper.NavmeshMemoryMapperCastHit, bool, bool)
  fullName: PathOS.PathOSNavUtility.NavmeshMemoryMapper.XZRaycastMemoryMap(UnityEngine.Vector3, UnityEngine.Vector3, float, out PathOS.PathOSNavUtility.NavmeshMemoryMapper.NavmeshMemoryMapperCastHit, bool, bool)
  type: Method
  source:
    remote:
      path: LBS/Plugin/Modules/Simulation/PathOSPlugin/PathOSPlus/Scripts/Utilities/PathOSNavUtility.cs
      branch: ignacio-r-develop
      repo: https://github.com/ISILab-Utalca/ISILab.git
    id: XZRaycastMemoryMap
    path: ../LBS/Plugin/Modules/Simulation/PathOSPlugin/PathOSPlus/Scripts/Utilities/PathOSNavUtility.cs
    startLine: 397
  assemblies:
  - PathOSPlus
  namespace: PathOS
  summary: >-
    Performs a raycast through the memory-mapped navigation mesh, sampling along a specified direction and

    distance, and returns information about the encountered tiles and obstacles.
  remarks: >-
    The raycast samples the navigation mesh at regular intervals, stopping when
        it reaches the edge of the grid, encounters more than one obstacle tile, or exceeds the specified
        maximum distance. This method can be used to determine visibility or path obstruction in grid-based
        navigation systems.
  example: []
  syntax:
    content: public void XZRaycastMemoryMap(Vector3 origin, Vector3 dir, float maxDistance, out PathOSNavUtility.NavmeshMemoryMapper.NavmeshMemoryMapperCastHit hit, bool fillSeen = false, bool pointSample = false)
    parameters:
    - id: origin
      type: UnityEngine.Vector3
      description: The starting point of the ray in world coordinates.
    - id: dir
      type: UnityEngine.Vector3
      description: The normalized direction vector along which to cast the ray.
    - id: maxDistance
      type: System.Single
      description: The maximum distance, in world units, to cast the ray from the origin.
    - id: hit
      type: PathOS.PathOSNavUtility.NavmeshMemoryMapper.NavmeshMemoryMapperCastHit
      description: >-
        When this method returns, contains information about the raycast, including the number of unexplored
            tiles, the total distance traversed, and the proportion of unexplored tiles encountered.
    - id: fillSeen
      type: System.Boolean
      description: If set to <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/builtin-types/bool">true</a>, marks all sampled tiles along the ray as seen. The default is <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/builtin-types/bool">false</a>.
    - id: pointSample
      type: System.Boolean
      description: If set to <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/builtin-types/bool">true</a>, considers the raycast as a point sample. The default is <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/builtin-types/bool">false</a>.
    content.vb: Public Sub XZRaycastMemoryMap(origin As Vector3, dir As Vector3, maxDistance As Single, hit As PathOSNavUtility.NavmeshMemoryMapper.NavmeshMemoryMapperCastHit, fillSeen As Boolean = False, pointSample As Boolean = False)
  overload: PathOS.PathOSNavUtility.NavmeshMemoryMapper.XZRaycastMemoryMap*
  nameWithType.vb: PathOSNavUtility.NavmeshMemoryMapper.XZRaycastMemoryMap(Vector3, Vector3, Single, PathOSNavUtility.NavmeshMemoryMapper.NavmeshMemoryMapperCastHit, Boolean, Boolean)
  fullName.vb: PathOS.PathOSNavUtility.NavmeshMemoryMapper.XZRaycastMemoryMap(UnityEngine.Vector3, UnityEngine.Vector3, Single, PathOS.PathOSNavUtility.NavmeshMemoryMapper.NavmeshMemoryMapperCastHit, Boolean, Boolean)
  name.vb: XZRaycastMemoryMap(Vector3, Vector3, Single, NavmeshMemoryMapperCastHit, Boolean, Boolean)
