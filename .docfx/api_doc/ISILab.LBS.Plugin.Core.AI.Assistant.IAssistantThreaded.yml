  assemblies:
  - LBS
  namespace: ISILab.LBS.Plugin.Core.AI.Assistant
  summary: >-
    Checks if the provided cancellation token has been triggered, and if so,

    automatically calls the <xref href="ISILab.LBS.Plugin.Core.AI.Assistant.IAssistantThreaded.OnTaskCancelled" data-throw-if-not-resolved="false"></xref> implementation.
  remarks: >-
    Use this method like:

    <pre><code class="lang-csharp">if(((IAssistantThreaded)this).CheckPendingCancel(this, token))

    {
      return;
    }</code></pre>

    All logic for handling cancellation should reside within the 

    <xref href="ISILab.LBS.Plugin.Core.AI.Assistant.IAssistantThreaded.OnTaskCancelled" data-throw-if-not-resolved="false"></xref> implementation.
  example: []
  syntax:
    content: bool CheckPendingCancel(object InterfaceOwner, CancellationToken cancellationToken)
    parameters:
    - id: InterfaceOwner
      type: System.Object
      description: The class instance implementing <xref href="ISILab.LBS.Plugin.Core.AI.Assistant.IAssistantThreaded" data-throw-if-not-resolved="false"></xref> where the token check is performed.
    - id: cancellationToken
      type: System.Threading.CancellationToken
      description: The <xref href="System.Threading.CancellationToken" data-throw-if-not-resolved="false"></xref> associated with the current task.
    return:
      type: System.Boolean
      description: <code>true</code> if the token was cancelled and <xref href="ISILab.LBS.Plugin.Core.AI.Assistant.IAssistantThreaded.OnTaskCancelled" data-throw-if-not-resolved="false"></xref> was invoked; otherwise <code>false</code>.
    content.vb: Function CheckPendingCancel(InterfaceOwner As Object, cancellationToken As CancellationToken) As Boolean
  overload: ISILab.LBS.Plugin.Core.AI.Assistant.IAssistantThreaded.CheckPendingCancel*
