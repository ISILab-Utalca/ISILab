    id: QuestGraph
    path: ../LBS/Plugin/Components/Data/Quest/QuestGraph.cs
    startLine: 27
  assemblies:
  - LBS
  namespace: ISILab.LBS.Modules
  summary: >-
    The graph contains the quest nodes and edges, it also contains the grammar reference to validate the graph and the root node reference to easily access it.


    <p>

    Also contains multiple actions and delegates to update the graph and notify the changes to the editor and the following classes:

    <ul><li><xref href="ISILab.LBS.Behaviours.QuestBehaviour" data-throw-if-not-resolved="false"></xref>: Controls the adding, removal of graph nodes and edges.</li><li><xref href="ISILab.LBS.Behaviours.NodeDataBehaviour" data-throw-if-not-resolved="false"></xref>: Controls data assignment within a graph node of QuestNode type</li><li><xref href="ISILab.LBS.Plugin.Core.AI.Assistant.GrammarAssistant" data-throw-if-not-resolved="false"></xref>: Controls the validity of the graph's structure and gives fixing recommendations.</li><li><xref href="ISILab.LBS.Plugin.Core.AI.Assistant.QuestAssistant" data-throw-if-not-resolved="false"></xref>: Reads context from other layers (assigned by the user) and recommends new nodes based on the other layer's data.</li></ul>

    </p>
  example: []
  syntax:
    content: >-
      [Serializable]

      public class QuestGraph : LBSModule, ICloneable, ISelectable
    content.vb: >-
      <Serializable>

      Public Class QuestGraph Inherits LBSModule Implements ICloneable, ISelectable
