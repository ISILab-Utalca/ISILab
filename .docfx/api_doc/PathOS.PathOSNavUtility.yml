  name: CanAgentReachTarget(NavMeshAgent, Vector3, float, ref Vector3)
  nameWithType: PathOSNavUtility.CanAgentReachTarget(NavMeshAgent, Vector3, float, ref Vector3)
  fullName: PathOS.PathOSNavUtility.CanAgentReachTarget(UnityEngine.AI.NavMeshAgent, UnityEngine.Vector3, float, ref UnityEngine.Vector3)
  type: Method
  source:
    remote:
      path: LBS/Plugin/Modules/Simulation/PathOSPlugin/PathOSPlus/Scripts/Utilities/PathOSNavUtility.cs
