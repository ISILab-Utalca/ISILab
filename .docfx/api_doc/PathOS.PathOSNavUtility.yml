    id: CanAgentReachTarget
    path: ../LBS/Plugin/Modules/Simulation/PathOSPlugin/PathOSPlus/Scripts/Utilities/PathOSNavUtility.cs
    startLine: 808
  assemblies:
  - PathOSPlus
  namespace: PathOS
  summary: >-
    Determines whether the specified NavMesh agent can reach the given target position within a specified

    margin.
  remarks: >-
    This method first samples the NavMesh near the target position within the specified
        margin, then checks if a complete path exists from the agent's current position to the sampled point. If the
        target is not on the NavMesh or a valid path cannot be found, the method returns false. The result parameter
        is updated with the closest valid position found on the NavMesh.
  example: []
  syntax:
    content: public static bool CanAgentReachTarget(NavMeshAgent agent, Vector3 target, float margin, ref Vector3 result)
    parameters:
    - id: agent
      type: UnityEngine.AI.NavMeshAgent
      description: >-
        The NavMeshAgent instance used to calculate the path to the target position. Must be placed on a valid
            NavMesh.
    - id: target
      type: UnityEngine.Vector3
      description: The world-space position to reach. The method checks if this position is accessible by the agent.
    - id: margin
      type: System.Single
      description: >-
        The maximum distance, in world units, to search for a walkable position near the target. Must be
            non-negative.
    - id: result
      type: UnityEngine.Vector3
      description: When this method returns, contains the closest walkable position on the NavMesh to the target, if found.
    return:
      type: System.Boolean
      description: true if the agent can reach the target position with a complete path; otherwise, false.
    content.vb: Public Shared Function CanAgentReachTarget(agent As NavMeshAgent, target As Vector3, margin As Single, result As Vector3) As Boolean
